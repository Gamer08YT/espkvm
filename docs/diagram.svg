<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="diagram-title" font-family="-apple-system, Segoe UI, Roboto, sans-serif" role="img" viewBox="0 0 760 250"><title id="diagram-title">The target machine&apos;s HDMI goes to the capture board, which feeds the ESP32-P4 over MIPI CSI-2. The ESP32-P4 reaches the operator&apos;s browser over Ethernet, and plugs back into the target as a USB keyboard and mouse.</title><style>:root{--bg-soft:#eaeef3;--box:#ffffff;--border:#d3d9e0;--text:#10151c;--muted:#4c5764;--accent:#1f6feb}@media (prefers-color-scheme:dark){:root{--bg-soft:#12171e;--box:#161b22;--border:#2a313c;--text:#e6edf3;--muted:#9aa7b4;--accent:#4c9aff}}.box,.panel{stroke:var(--border)}.panel{fill:var(--bg-soft);stroke-width:1}.box{fill:var(--box);stroke-width:1.5}.box-accent{stroke:var(--accent)}.label{fill:var(--text);font-size:13px;font-weight:600}.sub{fill:var(--muted);font-size:11px}.wire{stroke:var(--muted);stroke-width:1.5;fill:none;color:var(--muted)}.wire-accent{stroke:var(--accent);color:var(--accent)}.wire-label{fill:var(--muted);font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="7" refY="4" viewBox="0 0 8 8"><path fill="currentColor" d="M0,0 L8,4 L0,8 z"/></marker></defs><rect width="758" height="248" x="1" y="1" class="panel" rx="12"/><rect width="150" height="76" x="8" y="34" class="box" rx="8"/><text x="83" y="66" class="label" text-anchor="middle">target machine</text><text x="83" y="86" class="sub" text-anchor="middle">no OS needed</text><rect width="150" height="76" x="212" y="34" class="box" rx="8"/><text x="287" y="60" class="label" text-anchor="middle">TC358743</text><text x="287" y="78" class="sub" text-anchor="middle">HDMI capture</text><text x="287" y="94" class="sub" text-anchor="middle">Geekworm C790</text><rect width="150" height="76" x="416" y="34" class="box box-accent" rx="8"/><text x="491" y="60" class="label" text-anchor="middle">ESP32-P4</text><text x="491" y="78" class="sub" text-anchor="middle">ESP-KVM firmware</text><text x="491" y="94" class="sub" text-anchor="middle">Waveshare P4-ETH</text><rect width="132" height="76" x="620" y="34" class="box" rx="8"/><text x="686" y="66" class="label" text-anchor="middle">your browser</text><text x="686" y="86" class="sub" text-anchor="middle">anywhere on the LAN</text><line x1="158" x2="206" y1="72" y2="72" marker-end="url(#arrow)" class="wire"/><text x="182" y="60" class="wire-label" text-anchor="middle">HDMI</text><line x1="362" x2="410" y1="72" y2="72" marker-end="url(#arrow)" class="wire"/><text x="386" y="60" class="wire-label" text-anchor="middle">CSI-2</text><line x1="566" x2="614" y1="72" y2="72" marker-end="url(#arrow)" class="wire wire-accent"/><text x="590" y="60" class="wire-label" text-anchor="middle">HTTPS</text><path marker-end="url(#arrow)" d="M491,110 L491,180 L83,180 L83,116" class="wire"/><text x="287" y="200" class="wire-label" text-anchor="middle">USB - keyboard and mouse the target cannot tell from real ones</text></svg>