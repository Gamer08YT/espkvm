<svg xmlns="http://www.w3.org/2000/svg" aria-label="ATX wiring: ESP32-P4 GPIO to PC817 optocouplers to the motherboard front-panel header" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" viewBox="0 0 860 440"><style>:root{color-scheme:light dark}.bg{fill:#0e1116}.card,.chip{fill:#161b22;stroke:#2a313c}.chip{fill:#12171e}.title{fill:#e6edf3;font-weight:600}.label{fill:#9aa7b4}.pin{fill:#e6edf3;font-weight:600}.wire{stroke:#4c9aff}.wire-in{stroke:#46c17c}.iso{stroke:#3a4450;stroke-dasharray:5 5}.isoTxt{fill:#6b7885}@media (prefers-color-scheme:light){.bg{fill:#fff}.card,.chip{fill:#fff;stroke:#d3d9e0}.chip{fill:#eaeef3}.title{fill:#10151c}.label{fill:#4c5764}.pin{fill:#10151c}.wire{stroke:#1f6feb}.wire-in{stroke:#1a7f4b}.iso{stroke:#b6bec8}.isoTxt{fill:#6b7885}}text{font-size:14px}.sm{font-size:12px}.xs{font-size:11px}.wire,.wire-in{stroke-width:2.2;fill:none}</style><rect width="860" height="440" x="0" y="0" class="bg" rx="12"/><defs><marker id="arrow" markerHeight="9" markerWidth="9" orient="auto" refX="7" refY="3"><path fill="#4c9aff" d="M0,0 L7,3 L0,6 Z"/></marker><marker id="arrow-in" markerHeight="9" markerWidth="9" orient="auto" refX="7" refY="3"><path fill="#46c17c" d="M0,0 L7,3 L0,6 Z"/></marker></defs><rect width="180" height="300" x="24" y="70" class="card" rx="10"/><text x="114" y="102" class="title" text-anchor="middle">ESP32-P4</text><text x="114" y="122" class="label sm" text-anchor="middle">any free GPIO</text><rect width="84" height="34" x="120" y="150" class="chip" rx="6"/><text x="140" y="172" class="pin">GPIO 20</text><rect width="84" height="34" x="120" y="214" class="chip" rx="6"/><text x="140" y="236" class="pin">GPIO 21</text><rect width="84" height="34" x="120" y="292" class="chip" rx="6"/><text x="140" y="314" class="pin">GPIO 22</text><rect width="200" height="170" x="330" y="70" class="card" rx="10"/><text x="430" y="100" class="title" text-anchor="middle">PC817 x2 (out)</text><text x="430" y="120" class="label sm" text-anchor="middle">two-channel module</text><rect width="156" height="34" x="352" y="146" class="chip" rx="6"/><text x="366" y="167" class="pin sm">ch1 power</text><rect width="156" height="34" x="352" y="192" class="chip" rx="6"/><text x="366" y="213" class="pin sm">ch2 reset</text><rect width="200" height="100" x="330" y="270" class="card" rx="10"/><text x="430" y="300" class="title" text-anchor="middle">PC817 (in)</text><text x="430" y="320" class="label sm" text-anchor="middle">LED sense</text><rect width="156" height="30" x="352" y="326" class="chip" rx="6"/><text x="366" y="346" class="pin sm">1 channel</text><line x1="620" x2="620" y1="60" y2="380" class="iso"/><text x="620" y="52" class="isoTxt xs" text-anchor="middle">galvanic isolation</text><rect width="180" height="300" x="656" y="70" class="card" rx="10"/><text x="746" y="102" class="title" text-anchor="middle">F_PANEL</text><text x="746" y="122" class="label sm" text-anchor="middle">front-panel header</text><rect width="120" height="34" x="672" y="150" class="chip" rx="6"/><text x="686" y="172" class="pin sm">PW (power)</text><rect width="120" height="34" x="672" y="214" class="chip" rx="6"/><text x="686" y="236" class="pin sm">RES (reset)</text><rect width="120" height="34" x="672" y="292" class="chip" rx="6"/><text x="686" y="314" class="pin sm">PLED (+/-)</text><path marker-end="url(#arrow)" d="M204,167 H352" class="wire"/><path marker-end="url(#arrow)" d="M204,231 C260,231 300,209 352,209" class="wire"/><path marker-end="url(#arrow)" d="M508,163 C560,163 600,167 672,167" class="wire"/><path marker-end="url(#arrow)" d="M508,209 C560,209 600,231 672,231" class="wire"/><path marker-end="url(#arrow-in)" d="M672,309 C600,309 560,341 530,341" class="wire-in"/><path marker-end="url(#arrow-in)" d="M352,341 C280,341 240,309 204,309" class="wire-in"/><circle cx="40" cy="410" r="5" fill="#4c9aff"/><text x="52" y="414" class="label sm">output: KVM presses the button</text><circle cx="330" cy="410" r="5" fill="#46c17c"/><text x="342" y="414" class="label sm">input: KVM reads the power LED</text></svg>